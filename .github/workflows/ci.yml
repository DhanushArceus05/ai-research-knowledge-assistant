name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI never uses a real Gemini key or real model downloads: the test
      # suite mocks Gemini, the embedding model, the reranker, and OCR, so a
      # placeholder value here is sufficient and no secret is required.
      GEMINI_API_KEY: "ci-placeholder-not-a-real-key"
      JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
      DEBUG: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system dependencies (Tesseract for OCR tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax / import compilation check
        run: python -m compileall app main.py scripts tests

      - name: Verify the app imports and all routers register
        run: |
          python -c "
          from app.main import app
          routes = [r.path for r in app.routes if hasattr(r, 'methods')]
          assert '/health' in routes
          assert '/api/v1/auth/register' in routes
          assert '/api/v1/documents/upload' in routes
          print(f'{len(routes)} routes registered OK')
          "

      - name: Run pytest with coverage
        run: |
          pip install pytest-cov
          pytest --cov=app --cov-report=term-missing -q

  docker-build-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-research-knowledge-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
